<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">HXNS public architecture</title>
  <desc id="desc">Processed optical, inertial, pulsar, clock, and ephemeris products enter a Rust no-std navigation boundary that emits state, uncertainty, and telemetry. A host simulator supplies truth, noise, and faults outside the flight boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061422"/><stop offset="1" stop-color="#0b2942"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1f75b8"/><stop offset="1" stop-color="#43c2ff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".3"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7bcaff"/></marker>
    <style>
      .label{font:700 28px system-ui,sans-serif;fill:#f4f9ff}.small{font:500 20px system-ui,sans-serif;fill:#a9c4dc}.box{fill:#0c2033;stroke:#315879;stroke-width:2}.line{fill:none;stroke:#7bcaff;stroke-width:4;marker-end:url(#arrow)}.host{fill:none;stroke:#7694ad;stroke-width:2;stroke-dasharray:12 10}
    </style>
  </defs>
  <rect width="1600" height="820" rx="34" fill="url(#bg)"/>
  <text x="70" y="76" class="label">Processed navigation products</text>
  <text x="625" y="76" class="label">Flight-oriented boundary</text>
  <text x="1215" y="76" class="label">Outputs</text>

  <g filter="url(#shadow)">
    <rect class="box" x="70" y="125" width="400" height="108" rx="18"/>
    <text class="label" x="100" y="171">Optical front end</text><text class="small" x="100" y="205">body ID · LOS · apparent diameter</text>
    <rect class="box" x="70" y="257" width="400" height="108" rx="18"/>
    <text class="label" x="100" y="303">IMU + attitude</text><text class="small" x="100" y="337">specific force · body-to-ICRF rotation</text>
    <rect class="box" x="70" y="389" width="400" height="108" rx="18"/>
    <text class="label" x="100" y="435">Processed pulsar TOA</text><text class="small" x="100" y="469">one residual + uncertainty / product</text>
    <rect class="box" x="70" y="521" width="400" height="108" rx="18"/>
    <text class="label" x="100" y="567">Atomic clock</text><text class="small" x="100" y="601">tick correlation · bias · drift</text>
    <rect class="box" x="70" y="653" width="400" height="108" rx="18"/>
    <text class="label" x="100" y="699">DE442-derived pack</text><text class="small" x="100" y="733">read-only Chebyshev ephemeris</text>
  </g>

  <g>
    <path class="line" d="M470 179 C560 179 550 290 625 290"/>
    <path class="line" d="M470 311 C560 311 550 350 625 350"/>
    <path class="line" d="M470 443 C560 443 550 410 625 410"/>
    <path class="line" d="M470 575 C560 575 550 470 625 470"/>
    <path class="line" d="M470 707 C575 707 540 530 625 530"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="625" y="180" width="500" height="430" rx="28" fill="url(#core)"/>
    <text x="875" y="255" text-anchor="middle" class="label" style="font-size:38px">HXNS Rust no_std core</text>
    <rect x="680" y="300" width="390" height="80" rx="16" fill="#082039" fill-opacity=".82"/><text x="875" y="350" text-anchor="middle" class="label">Prediction + gravity</text>
    <rect x="680" y="400" width="390" height="80" rx="16" fill="#082039" fill-opacity=".82"/><text x="875" y="450" text-anchor="middle" class="label">7-state EKF + gating</text>
    <rect x="680" y="500" width="390" height="70" rx="16" fill="#082039" fill-opacity=".82"/><text x="875" y="544" text-anchor="middle" class="label">Adaptive scheduler</text>
  </g>

  <path class="line" d="M1125 310 C1180 310 1180 210 1230 210"/>
  <path class="line" d="M1125 395 C1180 395 1180 395 1230 395"/>
  <path class="line" d="M1125 480 C1180 480 1180 580 1230 580"/>
  <g filter="url(#shadow)">
    <rect class="box" x="1230" y="150" width="300" height="120" rx="18"/><text class="label" x="1260" y="200">SSB state</text><text class="small" x="1260" y="236">position · velocity · clock</text>
    <rect class="box" x="1230" y="335" width="300" height="120" rx="18"/><text class="label" x="1260" y="385">Uncertainty</text><text class="small" x="1260" y="421">covariance · innovations</text>
    <rect class="box" x="1230" y="520" width="300" height="120" rx="18"/><text class="label" x="1260" y="570">Telemetry</text><text class="small" x="1260" y="606">accept/reject · health · rate</text>
  </g>

  <rect class="host" x="585" y="125" width="580" height="565" rx="32"/>
  <text class="small" x="610" y="728">HOST SIMULATOR OUTSIDE FLIGHT BOUNDARY: truth · noise · faults · paired seeds</text>
</svg>
