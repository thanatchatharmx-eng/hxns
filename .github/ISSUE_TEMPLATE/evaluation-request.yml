name: HXNS evaluation request
description: Start a non-confidential fit check for a software-in-the-loop sensor evaluation.
title: "Evaluation request: "
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include proprietary mission data, detailed sensor specifications, export-controlled information, personal data, credentials, or security-sensitive material. A private exchange can be arranged after an initial fit check.
  - type: input
    id: organization
    attributes:
      label: Organization or public project
      description: A public name or "independent research" is sufficient at this stage.
      placeholder: University lab, startup, research group, or independent project
    validations:
      required: true
  - type: dropdown
    id: use_case
    attributes:
      label: Evaluation interest
      options:
        - Standard processed-sensor evaluation
        - Customer-trajectory feasibility pilot
        - Sensor-interface feasibility
        - Research collaboration
        - Other non-confidential inquiry
    validations:
      required: true
  - type: checkboxes
    id: windows
    attributes:
      label: Public mission-window interest
      options:
        - label: Near Earth
        - label: Earth transition
        - label: Deep-space cruise
        - label: Neptune capture
        - label: Customer-specific trajectory (requires scoping)
  - type: checkboxes
    id: products
    attributes:
      label: Processed products of interest
      options:
        - label: Optical range and/or bearing
        - label: IMU propagation
        - label: Processed pulsar TOA
        - label: Atomic-clock correlation
        - label: Fault-recovery comparison
  - type: textarea
    id: outcome
    attributes:
      label: Desired public outcome
      description: Describe the decision you want an evaluation to support without posting sensitive specifications.
      placeholder: Compare sensor-suite contribution, test a cadence assumption, review a fault-recovery concept...
    validations:
      required: true
  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Public-data acknowledgement
      options:
        - label: I confirm that this issue contains no confidential, proprietary, personal, export-controlled, or security-sensitive data.
          required: true
